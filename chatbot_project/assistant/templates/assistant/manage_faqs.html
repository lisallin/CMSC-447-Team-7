{% extends "admin/base_site.html" %}
{% block content %}
<h1>Manage FAQs</h1>

<h2>Add FAQ</h2>
<form method="post" action="">
  {% csrf_token %}
  <input type="text" name="question" placeholder="Question" size="80"><br>
  <textarea name="answer" rows="4" cols="80" placeholder="Answer"></textarea><br>
  <button type="submit">Add FAQ</button>
</form>

<h2>Existing FAQs</h2>
<table border="1" cellpadding="5">
<tr><th>Question</th><th>Answer</th><th>Action</th></tr>
{% for faq in faqs %}
<tr>
  <td>{{ faq.question }}</td>
  <td>{{ faq.answer }}</td>
  <td><a href="?delete={{ faq.id }}">Delete</a></td>
</tr>
{% empty %}
<tr><td colspan="3">No FAQs yet.</td></tr>
{% endfor %}
</table>
{% endblock %}
